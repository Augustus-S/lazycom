name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        preset:
          - gcc-debug
          - clang-debug
          - gcc-release
          - gcc-debug-no-diagnostics
          - gcc-asan-ubsan
    env:
      PRESET: ${{ matrix.preset }}
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build make gcc-13 g++-13 clang-18

      - name: Configure
        run: |
          if [[ "$PRESET" == clang-debug ]]; then
            c_compiler=clang-18
            cxx_compiler=clang++-18
          else
            c_compiler=gcc-13
            cxx_compiler=g++-13
          fi
          package_suffix="~pre.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.g${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$(awk '$1 == "project(lazycom" && $2 == "VERSION" {print $3}' CMakeLists.txt)
            if [[ "$GITHUB_REF_NAME" != "v$version" &&
                  ! ( "$version" == *.0 && "$GITHUB_REF_NAME" == "v${version%.0}" ) ]]; then
              echo "Release tag must match project version $version" >&2
              exit 1
            fi
            package_suffix=
          fi
          cmake --preset "$PRESET" \
            -DCMAKE_C_COMPILER="$c_compiler" -DCMAKE_CXX_COMPILER="$cxx_compiler" \
            -DLAZYCOM_BUILD_COMMIT="$GITHUB_SHA" \
            -DLAZYCOM_PACKAGE_SUFFIX="$package_suffix"

      - name: Build
        run: cmake --build --preset "$PRESET"

  package:
    name: Package ${{ matrix.arch }} (glibc 2.27)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            base: ubuntu@sha256:dca176c9663a7ba4c1f0e710986f5a25e672842963d95b960191e2d9f7185ebe
          - arch: aarch64
            runner: ubuntu-24.04-arm
            base: ubuntu@sha256:f97a5103cca28097326814718e711c9c41b54853c26959d73495e40b1dd608f2
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build Ubuntu 18.04 toolchain
        env:
          BASE_IMAGE: ${{ matrix.base }}
        run: docker build --build-arg BASE_IMAGE="$BASE_IMAGE" -f packaging/legacy.Dockerfile -t lazycom-legacy packaging

      - name: Build portable packages
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            -e GITHUB_SHA -e GITHUB_REF_TYPE -e GITHUB_REF_NAME \
            -e GITHUB_RUN_NUMBER -e GITHUB_RUN_ATTEMPT -e CMAKE_BUILD_PARALLEL_LEVEL=2 \
            lazycom-legacy bash packaging/build-legacy.sh

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            dpkg-dev rpm file binutils curl desktop-file-utils squashfs-tools

      - name: Build AppImage with host packaging tools
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          bash packaging/build-appimage.sh build/gcc-release build/release-assets
          cd build/release-assets
          sha256sum ./*.deb ./*.rpm ./*.tar.gz ./*.AppImage > "SHA256SUMS-$(uname -m)"

      - name: Upload release bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-linux-${{ matrix.arch }}
          path: build/release-assets/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
          compression-level: 0

  release:
    name: Publish release
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-linux-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub release
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat SHA256SUMS-* > SHA256SUMS
          sha256sum --check SHA256SUMS
          tag="$GITHUB_REF_NAME"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          LazyCom $tag Linux x86_64 / aarch64 (ARM64) 版本。

          - Commit: $GITHUB_SHA
          - 构建记录: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - 兼容目标：Ubuntu 18.04+、Debian 11+（glibc 2.27+）；按 CPU 架构选择附件。
          - DEB: amd64 或 arm64；使用 apt install ./lazycom_*.deb 安装。
          - RPM: Fedora 44；使用 dnf install ./lazycom-*.rpm 安装。
          - 安装后的命令为 lazycom。
          - AppImage: 设置可执行权限后运行；无 FUSE 时可设置 APPIMAGE_EXTRACT_AND_RUN=1。
          - tar.gz: 解压后运行 usr/bin/lazycom，保留 usr 目录结构。
          - SHA256SUMS: 下载所需附件后使用 sha256sum --check --ignore-missing SHA256SUMS 校验。
          EOF
          gh release create "$tag" ./*.deb ./*.rpm ./*.AppImage ./*.tar.gz SHA256SUMS \
            --verify-tag \
            --title "LazyCom $tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
